```html
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Transaction</title>
</head>
<body>
    <h1>Edit Transaction</h1>

    <form method="post">
        {% csrf_token %}

        <div>
            <label for="title">Title</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ transaction.title }}"
                required
            >
        </div>

        <div>
            <label for="description">Description</label>
            <textarea
                id="description"
                name="description"
                rows="4"
                cols="50"
            >{{ transaction.description }}</textarea>
        </div>

        <div>
            <label for="amount">Amount</label>
            <input
                type="number"
                id="amount"
                name="amount"
                value="{{ transaction.amount }}"
                step="0.01"
                required
            >
        </div>
        
        <select>
            
            {% for category in categories %}
            <option value="{{category.id}}" 
            {% if category.id == transaction.category.id %}selected{% endif %}>{{category.name}}</option>


                
            {% endfor %}
                
        </select>
        <button type="submit">Save Changes</button>
    </form>

    <a href="{% url 'expenses:transaction-list' %}">Back to Transactions</a>
</body>
</html>
```
